version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  database:
    image: postgres:15-alpine
    container_name: dashboardai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard_ai_db
      POSTGRES_USER: desarrolladorchristian
      POSTGRES_PASSWORD: Dashboard_Agents_2025!
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - dashboardai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desarrolladorchristian -d dashboard_ai_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # Spring Boot Backend
  # ============================================
  backend:
    build:
      context: ./dashboardai_backend
      dockerfile: Dockerfile
    container_name: dashboardai_backend
    restart: unless-stopped
    environment:
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/dashboard_ai_db
      SPRING_DATASOURCE_USERNAME: desarrolladorchristian
      SPRING_DATASOURCE_PASSWORD: Dashboard_Agents_2025!
      
      # JPA Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      
      # Server Configuration
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      
      # JWT Configuration
      APP_JWT_SECRET: myVerySecureAndLongSecretKeyForJWTAuthentication2025WithMoreThan32Characters
      APP_JWT_EXPIRATION: 86400000
      
      # Application Configuration
      APP_NAME: Dashboard AI Backend
      APP_VERSION: 1.0.0
      APP_FRONTEND_URL: http://frontend:80
      
      # Email Configuration
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ferchris82@gmail.com
      SPRING_MAIL_PASSWORD: TU_APP_PASSWORD_AQUI
      
      # n8n Configuration (Production VPS)
      N8N_API_URL: https://n8n-n8n.hrxtio.easypanel.host/api/v1
      N8N_API_TOKEN: your_n8n_api_token_here
      N8N_WEBHOOK_URL: https://n8n-n8n.hrxtio.easypanel.host/webhook/evolution-api
      
      # Testing Configuration
      APP_TESTING_SKIP_EMAIL_VERIFICATION: "true"
    ports:
      - "8080:8080"
    networks:
      - dashboardai_network
    depends_on:
      - database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - backend_logs:/app/logs

  # ============================================
  # React Frontend
  # ============================================
  frontend:
    build:
      context: ./dashboardai_frontend
      dockerfile: Dockerfile
      args:
        # Build-time environment variables
        VITE_N8N_ENVIRONMENT: production
        VITE_N8N_PROD_API_URL: https://n8n-n8n.hrxtio.easypanel.host/api/v1
        VITE_N8N_PROD_WEBHOOK_URL: https://n8n-n8n.hrxtio.easypanel.host/webhook
        VITE_N8N_PROD_API_TOKEN: your_production_n8n_api_token_here
        VITE_API_BASE_URL: http://localhost:8080/api
        VITE_API_URL: http://localhost:8080/api
        VITE_APP_TITLE: DashboardAI
        VITE_APP_VERSION: 1.0.0
    container_name: dashboardai_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - dashboardai_network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # Redis (Optional - for caching/sessions)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: dashboardai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - dashboardai_network
    command: redis-server --appendonly yes --requirepass "Dashboard_Redis_2025!"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================
# Networks
# ============================================
networks:
  dashboardai_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
  backend_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs/backend
