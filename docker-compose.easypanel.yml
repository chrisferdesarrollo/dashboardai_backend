version: '3.8'

services:
  # ============================================
  # Spring Boot Backend (Solo)
  # ============================================
  backend:
    build:
      context: ./dashboardai_backend
      dockerfile: Dockerfile
    container_name: dashboardai_backend_prod
    restart: unless-stopped
    environment:
      # Database Configuration (PostgreSQL de EasyPanel)
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/dashboard_ai_db
      SPRING_DATASOURCE_USERNAME: desarrolladorchristian
      SPRING_DATASOURCE_PASSWORD: Dashboard_Agents_2025!
      
      # JPA Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      
      # Server Configuration
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      
      # JWT Configuration
      APP_JWT_SECRET: myVerySecureAndLongSecretKeyForJWTAuthentication2025WithMoreThan32Characters
      APP_JWT_EXPIRATION: 86400000
      
      # Application Configuration
      APP_NAME: Dashboard AI Backend
      APP_VERSION: 1.0.0
      APP_FRONTEND_URL: https://your-domain.com
      
      # Email Configuration
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ferchris82@gmail.com
      SPRING_MAIL_PASSWORD: TU_APP_PASSWORD_AQUI
      
      # n8n Configuration (EasyPanel existente)
      N8N_API_URL: https://n8n-n8n.hrxtio.easypanel.host/api/v1
      N8N_API_TOKEN: your_n8n_api_token_here
      N8N_WEBHOOK_URL: https://n8n-n8n.hrxtio.easypanel.host/webhook/evolution-api
      
      # Production Configuration
      SPRING_PROFILES_ACTIVE: prod
      APP_TESTING_SKIP_EMAIL_VERIFICATION: "false"
      
      # Logging
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_COM_DASHBOARDAI: INFO
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dashboardai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - backend_logs:/app/logs

  # ============================================
  # React Frontend
  # ============================================
  frontend:
    build:
      context: ./dashboardai_frontend
      dockerfile: Dockerfile
      args:
        # Build-time environment variables
        VITE_N8N_ENVIRONMENT: production
        VITE_N8N_PROD_API_URL: https://n8n-n8n.hrxtio.easypanel.host/api/v1
        VITE_N8N_PROD_WEBHOOK_URL: https://n8n-n8n.hrxtio.easypanel.host/webhook
        VITE_N8N_PROD_API_TOKEN: your_production_n8n_api_token_here
        VITE_API_BASE_URL: https://your-domain.com/api
        VITE_API_URL: https://your-domain.com/api
        VITE_APP_TITLE: DashboardAI
        VITE_APP_VERSION: 1.0.0
    container_name: dashboardai_frontend_prod
    restart: unless-stopped
    networks:
      - dashboardai_network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # Nginx Proxy Reverso (SSL + Dominios)
  # ============================================
  nginx-proxy:
    image: nginx:alpine
    container_name: dashboardai_nginx_prod
    restart: unless-stopped
    ports:
      - "3001:80"   # Puerto diferente para evitar conflicto con EasyPanel
      - "3443:443"  # Puerto diferente para evitar conflicto con EasyPanel
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - dashboardai_network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Redis Local (Solo si no lo tienes en EasyPanel)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: dashboardai_redis_prod
    restart: unless-stopped
    ports:
      - "6380:6379"  # Puerto diferente para evitar conflicto
    networks:
      - dashboardai_network
    command: redis-server --appendonly yes --requirepass "Dashboard_Redis_2025!" --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================
# Networks
# ============================================
networks:
  dashboardai_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16  # Subred diferente para evitar conflictos

# ============================================
# Volumes (Reducidos - usando servicios de EasyPanel)
# ============================================
volumes:
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/dashboardai/data/redis
  backend_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/dashboardai/logs/backend
  nginx_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/dashboardai/logs/nginx
